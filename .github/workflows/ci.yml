name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Fixtures match gen_fixtures.py (#100)
        run: |
          python3 test-fixtures/gen_fixtures.py
          git diff --exit-code test-fixtures/
          diff -r test-fixtures/configs app/src/test/resources/configs
      - name: validate.py agrees with the phone
        run: pip install jsonschema && python3 scripts/test_validate.py
      - name: Grep gate — no stray old applicationId (#242 F)
        run: python3 scripts/check_package_literals.py && python3 scripts/test_check_package_literals.py
      - name: Version rule (#255)
        run: python3 scripts/test_version.py
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Debug APK is signed with the committed debug key (#73)
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | tee signer.txt
          grep -qi "SHA-256 digest: 3a0cb6b59a1140b4b76d6a6fd70fbf3744f3174fd2479d89a3a148810cfd3dca" signer.txt
      - name: APK versionName matches the version rule (#255)
        run: |
          python3 scripts/version.py --check-apk app/build/outputs/apk/debug/*.apk
          python3 scripts/version.py --check-apk app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: reflow-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
