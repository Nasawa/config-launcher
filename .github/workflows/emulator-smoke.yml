name: Emulator smoke
# Test matrix: emulators API 29, 35 and 36 (minSdk 29). There are no androidTest sources yet,
# so this installs the debug APK, cold-starts MainActivity, and fails on a crash or ANR.
# Runs nightly, on demand, and on PRs labelled "emulator" (emulators are slow, so not on every PR).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'emulator')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 29, target: default, arch: x86 }
          - { api: 35, target: google_apis, arch: x86_64 }
          - { api: 36, target: google_apis, arch: x86_64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Smoke test on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-smoke-api${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
